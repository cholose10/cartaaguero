<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Carta - MenuClick (Tilo Café)</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:18px;background:#f7f3f0;color:#333}
    h1{text-align:center;color:#806250;margin-bottom:10px}
    .topRow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
    .controls{display:flex;gap:8px;align-items:center}
    input[type="text"], input[type="password"], textarea{padding:8px;border-radius:6px;border:1px solid #ccc;width:100%;box-sizing:border-box}
    button{background:#806250;color:#fff;border:none;padding:8px 10px;border-radius:6px;cursor:pointer;font-weight:600}
    button.secondary{background:#5c8a50}
    button.danger{background:#c0392b}
    form{background:#fff;padding:12px;border-radius:10px;margin-bottom:12px;display:none;box-shadow: 0 4px 6px rgba(0,0,0,0.05)}
    table{width:100%;border-collapse:collapse;background:#fff}
    th,td{border:1px solid #ddd;padding:8px;vertical-align:top}
    th{background:#806250;color:#fff}
    img.mini{max-width:60px;border-radius:6px}
    #guardarTodos{position:fixed;top:18px;right:18px;z-index:1200;padding:10px 14px;background:#a07b68;color:#fff;border-radius:8px;box-shadow: 0 4px 10px rgba(0,0,0,0.2)}
    #btnMozo{position:fixed;top:18px;right:220px;z-index:1200;padding:10px 14px;background:#c0392b;color:#fff;border-radius:8px}
    .small{font-size:13px;color:#666}
    .rowActions{display:flex;gap:6px}
    .previewImg{max-width:120px;margin-top:8px;border-radius:6px}
    .toast {
      position: fixed; top: 24px; right: 24px; z-index: 2000; padding: 12px 16px;
      border-radius: 8px; color: white; font-weight: 600; box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      opacity: 0; transform: translateY(-10px); transition: opacity .25s ease, transform .25s ease; max-width: 360px;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.ok { background: #2ecc71; }
    .toast.info { background: #3498db; }
    .toast.err { background: #e74c3c; }
    #loadingOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;font-size:20px;z-index:5000;text-align:center;padding:20px}
    @media(max-width:720px){ .topRow{flex-direction:column;align-items:flex-start} table{font-size:12px} #btnMozo, #guardarTodos{position:static;width:100%;margin-bottom:10px} }
  </style>
</head>
<body>

  <h1>Admin Carta — </h1>

  <div class="topRow">
    <div style="flex:1">
      <div style="margin-bottom:6px"><span class="small">Repositorio:</span> <b> tilo-restocafe / cartaaguero</b></div>
      <div style="display:flex;gap:8px;align-items:center">
        <label>Token:</label>
        <input type="password" id="token" placeholder="GitHub Token" style="max-width:250px">
        <button onclick="saveToken()">Guardar</button>
        <button onclick="clearToken()" style="background:#999">Borrar</button>
        <span id="tokenStatus" class="small" style="font-weight:bold">Validando...</span>
      </div>
    </div>
    <div class="controls">
      <input id="search" placeholder="Buscar plato..." oninput="filterProducts()" style="min-width:150px">
      <button onclick="toggleForm()">+ Nuevo Producto</button>
      <button class="secondary" onclick="irWhatsApp()">📲 Soporte</button>
    </div>
  </div>

  <button id="guardarTodos" onclick="guardarTodosLosPrecios()">💾 Guardar TODO en la nube</button>
  <button id="btnMozo" onclick="irTeleprompter()">🙋‍♂️ Mozo Digital</button>

  <form id="form">
    <input type="hidden" id="editId">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div><label>Nombre</label><input id="nombre" type="text"></div>
      <div><label>Precio</label><input id="precio" type="text" placeholder="Solo números"></div>
      <div style="grid-column:1/3"><label>Descripción</label><textarea id="descripcion" rows="2"></textarea></div>
      <div><label>Imagen URL</label><input id="imagen" type="text" oninput="previewImage()"></div>
      <div><label>Categoría</label><input id="categoria" type="text" placeholder="Ej: Cafetería"></div>
    </div>
    <div style="margin-top:10px">
      <button type="button" onclick="guardarFormulario()">Agregar a la lista</button>
      <button type="button" onclick="cancelForm()" style="background:#999">Cancelar</button>
    </div>
    <img id="preview" class="previewImg" style="display:none">
  </form>

  <table>
    <thead>
      <tr><th>Imagen</th><th>Nombre</th><th>Descripción</th><th>Categoría</th><th>Precio</th><th>Acciones</th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div id="loadingOverlay">
    <div style="font-size:40px; margin-bottom:15px">⏳</div>
    <div><b>Guardando y sincronizando ES / EN / PT...</b></div>
    <div style="font-size:14px; margin-top:10px; color:#ccc">No cierres la página, se descargará un backup automáticamente.</div>
  </div>
<script>
const USERNAME = "tilo-restocafe";
const REPO = "cartaaguero";
const BRANCH = "main";

const MAIN_JSON = "productos.json";
const EN_JSON = "productos-en.json";
const PT_JSON = "productos-port.json";

let productos = [];
let guardando = false;

/**************** UI HELPERS ****************/

function mostrarLoading(){
  document.getElementById("loadingOverlay").style.display = "flex";
}

function ocultarLoading(){
  document.getElementById("loadingOverlay").style.display = "none";
}

function bloquearUI(){

  document.querySelectorAll("button").forEach(b => {

    b.disabled = true;
    b.style.opacity = "0.5";
  });
}

function desbloquearUI(){

  document.querySelectorAll("button").forEach(b => {

    b.disabled = false;
    b.style.opacity = "1";
  });
}

function showToast(msg, variant = 'ok'){

  const div = document.createElement('div');

  div.className = `toast ${variant}`;

  div.innerText = msg;

  document.body.appendChild(div);

  requestAnimationFrame(() => {
    div.classList.add('show');
  });

  setTimeout(() => {

    div.classList.remove('show');

    setTimeout(() => div.remove(), 300);

  }, 3000);
}

/**************** TOKEN ****************/

function saveToken(){

  const t = document.getElementById('token').value.trim();

  localStorage.setItem('github_token', t);

  validarTokenGitHub();

  showToast('Token guardado');
}

function clearToken(){

  localStorage.removeItem('github_token');

  location.reload();
}

function getToken(){

  return localStorage.getItem('github_token');
}

async function validarTokenGitHub(){

  const token = getToken();

  const statusEl = document.getElementById('tokenStatus');

  if (!token) {

    statusEl.innerText = "❌ Sin Token";
    statusEl.style.color = "red";

    return;
  }

  try {

    const res = await fetch(
      'https://api.github.com/user',
      {
        headers: {
          Authorization: `token ${token}`
        }
      }
    );

    if (res.ok) {

      const data = await res.json();

      statusEl.innerText = `✅ ON: ${data.login}`;
      statusEl.style.color = "green";

    } else {

      statusEl.innerText = "⚠️ Token Vencido";
      statusEl.style.color = "orange";
    }

  } catch (e) {

    statusEl.innerText = "Error conexión";
    statusEl.style.color = "red";
  }
}

/**************** CORE ****************/

function sanitizePrice(v){

  if(v === undefined || v === null){
    return '0';
  }

  return String(v)
    .replace(/[^\d.,]/g,'')
    .replace(',', '.');
}

function findIndexById(id){

  return productos.findIndex(p => p.id === id);
}

function generateNextProdId(){

  let max = 0;

  productos.forEach(p => {

    const n = parseInt(
      String(p.id || '')
      .replace('prod',''),
      10
    );

    if(n > max){
      max = n;
    }
  });

  return 'prod' + String(max + 1).padStart(4, '0');
}

async function loadProducts(){

  try {

    const r = await fetch(
      `https://raw.githubusercontent.com/${USERNAME}/${REPO}/${BRANCH}/${MAIN_JSON}?t=${Date.now()}`
    );

    if(!r.ok){
      throw new Error('Error al cargar');
    }

    const data = await r.json();

    if(!Array.isArray(data)){
      throw new Error('JSON inválido');
    }

    productos = data;

    render(productos);

  } catch(e){

    console.error(e);

    showToast("Error cargando JSON", 'err');
  }
}

/**************** RENDER ****************/

function render(lista){

  const tb = document.getElementById('tbody');

  tb.innerHTML = '';

  lista.forEach(p => {

    const tr = document.createElement('tr');

    tr.dataset.rowId = p.id || '';

    const nombre = p.nombre || '';
    const descripcion = p.descripcion || '';
    const categoria = p.categoria || '';
    const precio = p.precio || '0';
    const imagen = p.imagen || '';

    tr.innerHTML = `

      <td>
        <img
          src="${imagen}"
          class="mini"
          onerror="this.style.display='none'"
        >
      </td>

      <td>
        <input
          type="text"
          value="${nombre.replace(/"/g,'&quot;')}"
        >
      </td>

      <td>
        <textarea>${descripcion}</textarea>
      </td>

      <td>
        <input
          type="text"
          value="${categoria.replace(/"/g,'&quot;')}"
        >
      </td>

      <td>
        <input
          type="text"
          class="input-precio"
          value="${precio}"
        >
      </td>

      <td class="rowActions">

        <button class="editBtn" style="background:#2d87d6">
          Editar
        </button>

        <button class="danger deleteBtn">
          Borrar
        </button>

      </td>
    `;

    const inputs = tr.querySelectorAll('input');

    inputs[0].oninput = e =>
      updateLocal(p.id, 'nombre', e.target.value);

    inputs[1].oninput = e =>
      updateLocal(p.id, 'categoria', e.target.value);

    const textarea = tr.querySelector('textarea');

    textarea.oninput = e =>
      updateLocal(p.id, 'descripcion', e.target.value);

    const precioInput = tr.querySelector('.input-precio');

    precioInput.oninput = e =>
      updateLocal(p.id, 'precio', e.target.value);

    precioInput.addEventListener('keydown', function(e){

      if(e.key === 'Tab'){

        e.preventDefault();

        const siguienteFila = tr.nextElementSibling;

        if(siguienteFila){

          const next =
            siguienteFila.querySelector('.input-precio');

          if(next){

            next.focus();
            next.select();
          }

        } else {

          showToast("Fin de lista", "info");
        }
      }
    });

    tr.querySelector('.editBtn').onclick = () =>
      loadIntoFormById(p.id);

    tr.querySelector('.deleteBtn').onclick = () =>
      eliminarProductoPorId(p.id);

    tb.appendChild(tr);
  });
}

function updateLocal(id, field, value){

  const idx = findIndexById(id);

  if(idx !== -1){

    if(field === 'precio'){
      value = sanitizePrice(value);
    }

    productos[idx][field] = value;
  }
}

/**************** DELETE ****************/

function eliminarProductoPorId(id){

  if(!confirm('¿Quitar plato de la lista?')){
    return;
  }

  productos = productos.filter(p => p.id !== id);

  render(productos);

  showToast(
    "Quitado localmente. Recordá Guardar Todo.",
    "info"
  );
}

/**************** GITHUB ****************/

async function githubPutFile(path, contentString, message){

  const token = getToken();

  if(!token){
    throw new Error("Sin token");
  }

  const cacheBuster = `?t=${Date.now()}`;

  let sha = undefined;

  try {

    const resInfo = await fetch(
      `https://api.github.com/repos/${USERNAME}/${REPO}/contents/${path}${cacheBuster}`,
      {
        headers: {
          Authorization: `token ${token}`
        }
      }
    );

    if(resInfo.ok){

      const data = await resInfo.json();

      sha = data.sha;
    }

  } catch(e){

    console.error(e);
  }

  const body = {

    message,

    content: btoa(
      unescape(
        encodeURIComponent(contentString)
      )
    ),

    branch: BRANCH,

    sha
  };

  const res = await fetch(
    `https://api.github.com/repos/${USERNAME}/${REPO}/contents/${path}`,
    {
      method: 'PUT',
      headers: {
        Authorization: `token ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    }
  );

  if(!res.ok){

    const err = await res.text();

    console.error(err);

    throw new Error(err);
  }
}

async function guardarTodosLosPrecios(){

  if(guardando){

    showToast(
      "⏳ Ya se está guardando...",
      "info"
    );

    return;
  }

  guardando = true;

  if(!getToken()){

    showToast("Falta Token", "err");

    guardando = false;

    return;
  }

  const blob = new Blob(
    [JSON.stringify(productos, null, 2)],
    {type: 'application/json'}
  );

  const a = document.createElement('a');

  a.href = URL.createObjectURL(blob);

  a.download =
    `backup_carta_${new Date().toISOString().slice(0,10)}.json`;

  a.click();

  mostrarLoading();

  bloquearUI();

  try {

    const outES = productos.map(p => ({

      nombre: p.nombre || '',

      descripcion: p.descripcion || '',

      precio: sanitizePrice(p.precio),

      imagen: p.imagen || '',

      categoria: p.categoria || '',

      id: p.id
    }));

    await githubPutFile(
      MAIN_JSON,
      JSON.stringify(outES, null, 2),
      "Update ES"
    );

    await syncLangs(productos);

    render(productos);

    showToast(
      "✅ Cambios aplicados correctamente",
      "ok"
    );

  } catch(e){

    console.error(e);

    showToast(
      "Error al sincronizar",
      "err"
    );

  } finally {

    guardando = false;

    ocultarLoading();

    desbloquearUI();

    render(productos);

    setTimeout(() => {

      loadProducts();

    }, 8000);
  }
}

async function syncLangs(masterList){

  const files = [

    {path: EN_JSON, lang: 'EN'},

    {path: PT_JSON, lang: 'PT'}
  ];

  for(const f of files){

    try {

      const res = await fetch(
        `https://raw.githubusercontent.com/${USERNAME}/${REPO}/${BRANCH}/${f.path}?t=${Date.now()}`
      );

      let list = await res.json();

      list = list.map(item => {

        const master =
          masterList.find(m => m.id === item.id);

        if(master){

          const p = sanitizePrice(master.precio);

          if(item.precio !== undefined){
            item.precio = p;
          }

          if(item.price !== undefined){
            item.price = p;
          }

          if(item.preco !== undefined){
            item.preco = p;
          }
        }

        return item;
      });

      await githubPutFile(
        f.path,
        JSON.stringify(list, null, 2),
        `Sync Prices ${f.lang}`
      );

    } catch(e){

      console.error("Error en", f.path);
    }
  }
}

/**************** FORM ****************/

function toggleForm(){

  const f = document.getElementById('form');

  if(f.style.display === 'block'){

    f.style.display = 'none';

  } else {

    f.style.display = 'block';

    setTimeout(() => {

      document.getElementById('nombre').focus();

    }, 100);
  }
}

function cancelForm(){

  document.getElementById('form').reset();

  document.getElementById('editId').value = '';

  document.getElementById('preview').style.display = 'none';

  document.getElementById('form').style.display = 'none';
}

function previewImage(){

  const img = document.getElementById('preview');

  const url =
    document.getElementById('imagen').value.trim();

  if(!url){

    img.style.display = 'none';

    return;
  }

  img.src = url;

  img.onerror = () => {

    img.style.display = 'none';
  };

  img.onload = () => {

    img.style.display = 'block';
  };
}

function guardarFormulario(){

  const id = document.getElementById('editId').value;

  const nombre =
    document.getElementById('nombre')
    .value
    .trim();

  if(!nombre){

    showToast("Falta nombre", "err");

    return;
  }

  const obj = {

    nombre,

    precio: sanitizePrice(
      document.getElementById('precio').value
    ),

    descripcion:
      document.getElementById('descripcion').value || '',

    imagen:
      document.getElementById('imagen').value || '',

    categoria:
      document.getElementById('categoria').value || 'General',

    id: id || generateNextProdId()
  };

  if(id){

    const idx = findIndexById(id);

    if(idx !== -1){

      productos[idx] = obj;
    }

  } else {

    const existe = productos.some(
      p => p.nombre.toLowerCase() === nombre.toLowerCase()
    );

    if(existe){

      showToast("Producto duplicado", "info");

      return;
    }

    productos.push(obj);
  }

  render(productos);

  cancelForm();

  showToast("Lista actualizada");
}

function loadIntoFormById(id){

  const p = productos.find(x => x.id === id);

  if(!p){
    return;
  }

  document.getElementById('editId').value = p.id || '';

  document.getElementById('nombre').value =
    p.nombre || '';

  document.getElementById('precio').value =
    p.precio || '';

  document.getElementById('descripcion').value =
    p.descripcion || '';

  document.getElementById('imagen').value =
    p.imagen || '';

  document.getElementById('categoria').value =
    p.categoria || '';

  previewImage();

  document.getElementById('form').style.display = 'block';

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

/**************** SEARCH ****************/

function filterProducts(){

  const q = document
    .getElementById('search')
    .value
    .toLowerCase()
    .trim();

  const f = productos.filter(p => {

    const nombre =
      (p.nombre || '').toLowerCase();

    const categoria =
      (p.categoria || '').toLowerCase();

    return (
      nombre.includes(q) ||
      categoria.includes(q)
    );
  });

  render(f);
}

/**************** LINKS ****************/

function irTeleprompter(){

  window.open(
    `https://${USERNAME}.github.io/${REPO}/admin/admin.html`,
    "_blank"
  );
}

function irWhatsApp(){

  window.open(
    "https://wa.me/5491123140119?text=Hola+MenuClick+Ayuda",
    "_blank"
  );
}

/**************** INIT ****************/

document.addEventListener('DOMContentLoaded', () => {

  loadProducts();

  validarTokenGitHub();
});
</script>
</body>
</html>
